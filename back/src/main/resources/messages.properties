# 기본(한국어) 메시지 번들.
# sberp_lang 쿠키 값이 ko 이거나, 없거나, en/ko 이외의 값일 때 사용되는 fallback.
#
# 네이밍 컨벤션(다음 단계에서 도메인별 예외/검증 메시지를 옮길 때 참고):
#   error.<도메인>.<의미>              예) error.emp.notFound
#   validation.<Entity>.<field>.<제약>  예) validation.emp.empId.required
#
# DeptTransferException은 이미 안정적인 errorCode(NO_TRANSFER_ITEMS 등)를 갖고 있어,
# GlobalExceptionHandler가 messageSource.getMessage(errorCode, args, ex.getMessage(), locale)
# 형태로 조회한다. 즉 이 파일/en 파일에 그 코드와 같은 이름의 key를 추가하기만 하면
# 코드(DeptTransferServiceImpl) 수정 없이 해당 예외 메시지부터 바로 번역할 수 있다.
# 아직은 그 key들을 등록하지 않았으므로, 지금은 기존과 동일하게 ex.getMessage()(한글)가
# 그대로 내려간다. 나머지 76곳의 예외 메시지 / 128곳의 검증(@NotBlank 등) 메시지도
# 아직 이 키 체계로 옮기지 않았다(이번 범위 밖) — 지금처럼 한글 리터럴 그대로 내려간다.

error.internal=서버 내부 오류가 발생했습니다. 잠시 후 다시 시도해주세요.
