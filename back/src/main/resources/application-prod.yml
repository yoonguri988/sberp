# 운영(prod) 프로파일 전용 설정.
# application.yml(공통/개발 기본값)을 이 파일의 값으로 덮어쓴다.
# 활성화: -Dspring.profiles.active=prod 또는 SPRING_PROFILES_ACTIVE=prod

# 운영 환경에서는 Swagger UI / API 문서를 외부에 노출하지 않는다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  jpa:
    hibernate:
      # 운영에서는 스키마를 자동으로 생성/수정하지 않는다.
      # 스키마는 마이그레이션(DDL 스크립트/형상관리)으로 별도 관리하고,
      # 애플리케이션 기동 시에는 엔티티-테이블 매핑이 일치하는지만 검증한다.
      ddl-auto: validate
    properties:
      hibernate:
        # 운영 로그에 매 쿼리의 SQL 원문이 그대로 남지 않도록 끈다.
        format_sql: false
        show_sql: false
        default_batch_fetch_size: 100

logging:
  level:
    # 운영에서는 인증/인가 처리 상세 로그를 남기지 않는다.
    org.springframework.security: WARN
